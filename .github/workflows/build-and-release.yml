name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build project
      run: npm run build:prod
      
    - name: Create release archive
      run: |
        cd dist
        tar -czf ../grover-podcast-v${GITHUB_REF#refs/tags/}.tar.gz .
        cd ..
        zip -r grover-podcast-v${GITHUB_REF#refs/tags/}.zip dist/
        
    - name: Upload release assets
      uses: actions/upload-artifact@v4
      with:
        name: release-files
        path: |
          grover-podcast-v*.tar.gz
          grover-podcast-v*.zip
          
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          grover-podcast-v*.tar.gz
          grover-podcast-v*.zip
        body: |
          ## 🚀 Release v${{ github.ref_name }}
          
          ### What's New
          - Minified CSS and JavaScript files for better performance
          - Optimized images for faster loading
          - Production-ready build with all assets optimized
          
          ### Build Details
          - CSS minification: ✅
          - JavaScript minification: ✅
          - Image optimization: ✅
          - HTML processing: ✅
          
          ### Download
          - **Source Code**: `grover-podcast-v${{ github.ref_name }}.tar.gz`
          - **Production Build**: `grover-podcast-v${{ github.ref_name }}.zip`
          
          ### Installation
          Extract the production build zip file and serve the contents with any web server.
          
          ```bash
          # Example using Python
          cd grover-podcast-v${{ github.ref_name }}
          python -m http.server 8000
          
          # Example using Node.js
          cd grover-podcast-v${{ github.ref_name }}
          npx http-server -p 8000
          ```
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
